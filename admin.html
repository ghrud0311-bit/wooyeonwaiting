<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>우연 — 관리자</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f7f6f4; --surface: #ffffff; --surface2: #f2f1ef;
  --border: #e8e6e2; --border2: #d8d6d2;
  --text: #1a1916; --text2: #6e6b66; --text3: #a8a49e;
  --accent: #1a1916; --danger: #c0503e; --success: #4a8c5c;
  --warning: #b87c2a; --male: #4a7ab8; --female: #b84a7a;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem; }
.login-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem 1.5rem; width: 100%; max-width: 320px; }
.login-title { font-size: 18px; font-weight: 400; margin-bottom: 0.3rem; }
.login-sub { font-size: 12px; color: var(--text3); margin-bottom: 1.5rem; }
.login-input { width: 100%; padding: 11px 13px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 14px; color: var(--text); font-family: 'Noto Sans KR', sans-serif; outline: none; margin-bottom: 10px; }
.login-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; }
.login-err { font-size: 12px; color: var(--danger); margin-top: 8px; min-height: 16px; text-align: center; }
.admin { display: none; max-width: 480px; margin: 0 auto; padding: 0 1rem 4rem; }
.admin-header { padding: 1.5rem 0 1rem; display: flex; justify-content: space-between; align-items: center; }
.admin-title { font-size: 18px; font-weight: 400; }
.header-btns { display: flex; align-items: center; gap: 8px; }
.open-index-btn { font-size: 11px; color: var(--surface); background: var(--accent); border: none; border-radius: 6px; cursor: pointer; padding: 6px 10px; }
.logout-btn { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; }
.dialer-btn.on { background: var(--success); border-color: var(--success); color: #fff; }
.toast-box { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px); background: rgba(30,30,30,0.92); color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 9999; max-width: 86%; text-align: center; }
.toast-box.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.section { margin-bottom: 1rem; }
.section-label { font-size: 10px; color: var(--text3); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 0.6rem; }
.seat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 8px; }
.seat-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.7rem; }
.seat-name { font-size: 12px; font-weight: 500; }
.seat-meta-nums { font-size: 11px; color: var(--text2); text-align: right; }
.seat-meta-cap { font-size: 10px; color: var(--text3); margin-top: 1px; text-align: right; }
.seat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.seat-input-wrap { display: flex; align-items: center; gap: 6px; }
.seat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.seat-dot.male { background: var(--male); }
.seat-dot.female { background: var(--female); }
.seat-label { font-size: 11px; color: var(--text2); flex: 1; }
.counter { display: flex; align-items: center; }
.counter-btn { width: 28px; height: 28px; background: var(--surface2); border: 1px solid var(--border); font-size: 16px; color: var(--text2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.counter-btn:first-child { border-radius: 6px 0 0 6px; }
.counter-btn:last-child { border-radius: 0 6px 6px 0; }
.counter-btn:hover:not(:disabled) { background: var(--border); }
.counter-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.counter-val { width: 42px; height: 28px; background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text); text-align: center; outline: none; border-left: none; border-right: none; }
.seat-bar { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.seat-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
.seat-bar-fill.male { background: var(--male); }
.seat-bar-fill.female { background: var(--female); }
.op-status { display: flex; align-items: center; gap: 7px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.op-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.op-dot.on { background: var(--danger); box-shadow: 0 0 5px var(--danger); animation: pulse 2s infinite; }
.op-dot.off { background: var(--text3); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.op-text { font-size: 12px; }
.seat-remain { font-size: 11px; margin-left: auto; font-weight: 500; }
.seat-remain.ok { color: var(--success); }
.seat-remain.warn { color: var(--warning); }
.seat-remain.full { color: var(--danger); }
.waiting-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.waiting-empty { padding: 2rem; text-align: center; font-size: 13px; color: var(--text3); }
.waiting-item { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.waiting-item:last-child { border-bottom: none; }
.waiting-item.hearted { outline: 2px solid #e879a8; outline-offset: -2px; background: #fff5f9; }
.waiting-item.greyed { background: #efefef !important; outline: none !important; }
.waiting-item.greyed .waiting-name { text-decoration: line-through; color: var(--text3); }
.waiting-item.greyed .waiting-meta { color: var(--text3); }
.waiting-item.coming-state { background: #f0f0f0; }
.icon-btns { display: flex; align-items: center; gap: 3px; flex-shrink: 0; }
.star-btn { background: none; border: none; font-size: 15px; cursor: pointer; line-height: 1; padding: 3px; color: var(--border2); transition: color 0.15s; }
.star-btn.active { color: #f0b429; }
.heart-btn { background: none; border: none; font-size: 15px; cursor: pointer; line-height: 1; padding: 3px; color: var(--border2); transition: color 0.15s; }
.heart-btn.active { color: #e879a8; }
.waiting-num { font-size: 11px; color: var(--text3); min-width: 18px; flex-shrink: 0; }
.waiting-info { flex: 1; min-width: 0; }
.name-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.cust-name { font-size: 13px; font-weight: 600; color: var(--text); }
.waiting-name { font-size: 13px; font-weight: 500; }
.waiting-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.gender-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; flex-shrink: 0; }
.gender-badge.male { background: #eef3fb; color: var(--male); }
.gender-badge.female { background: #fbeef5; color: var(--female); }
.seat-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; flex-shrink: 0; }
.seat-badge.table { background: #eef3fb; color: #2a5fa8; }
.seat-badge.dodgy { background: #eef6f1; color: #2a7a4a; }
.seat-badge.free { background: #fdf6e0; color: #8a6020; }
.loyal-badge { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 500; flex-shrink: 0; background: #fff4e0; color: #a06010; border: 1px solid #f0d090; display: inline-flex; align-items: center; gap: 2px; cursor: pointer; font-family: inherit; }
.loyal-badge:active { background: #ffe8c8; }
.loyal-badge.ready { background: #ffe8c8; color: #804010; border-color: #e0a050; font-weight: 600; }
.loyal-info-grid { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; text-align: left; margin-top: 8px; }
.loyal-info-grid .label { color: var(--text3); font-weight: 400; }
.loyal-info-grid .value { color: var(--text1); font-weight: 500; }
.loyal-info-grid .value.accent { color: #a06010; font-weight: 600; }
.loyal-info-progress { background: #f7f3eb; border: 1px solid #e8dcc4; border-radius: 6px; padding: 8px 10px; margin-top: 10px; text-align: center; font-size: 12px; color: #6b4400; }
.loyal-info-progress strong { color: #b86b00; font-size: 13px; }
/* 쿠폰 발급 대기 배너 */
.coupon-banner { background: linear-gradient(135deg, #fff4e0, #ffe8c8); border: 1.5px solid #e0a050; border-radius: 12px; padding: 12px 14px; }
.coupon-banner-head { font-size: 13px; font-weight: 600; color: #804010; margin-bottom: 8px; }
.coupon-banner-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid #f0d090; }
.coupon-banner-item:first-of-type { border-top: none; }
.coupon-banner-info { flex: 1; min-width: 0; }
.coupon-banner-phone { font-size: 13px; font-weight: 500; color: #6b4400; }
.coupon-banner-meta { font-size: 11px; color: #a06010; margin-top: 1px; }
.coupon-banner-btn { padding: 6px 10px; background: #d49a3b; color: #fff; border: none; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; flex-shrink: 0; }
.coupon-banner-btn:active { background: #b8832d; }
/* 단골 명단 모달 */
.loyal-list-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 250; align-items: center; justify-content: center; padding: 1rem; }
.loyal-list-overlay.active { display: flex; }
.loyal-list-box { background: var(--surface); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; display: flex; flex-direction: column; }
.loyal-list-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 8px; border-bottom: 1px solid var(--border); }
.loyal-list-title { font-size: 16px; font-weight: 600; color: var(--text1); margin: 0; }
.loyal-list-close { background: none; border: none; font-size: 18px; color: var(--text3); cursor: pointer; padding: 4px 8px; line-height: 1; }
.loyal-list-controls { padding: 10px 14px; border-bottom: 1px solid var(--border); }
.loyal-search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; margin-bottom: 8px; box-sizing: border-box; }
.loyal-sort-tabs { display: flex; gap: 4px; }
.loyal-sort-tab { flex: 1; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; color: var(--text3); }
.loyal-sort-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.loyal-list-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.loyal-list-empty { padding: 30px 16px; text-align: center; color: var(--text3); font-size: 13px; }
.loyal-list-row { padding: 10px 14px; border-bottom: 1px solid #f3f0eb; display: flex; align-items: center; gap: 8px; }
.loyal-list-row:last-child { border-bottom: none; }
.loyal-list-row.ready { background: #fff8ec; }
.loyal-row-info { flex: 1; min-width: 0; }
.loyal-row-top { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.loyal-row-phone { font-size: 13px; font-weight: 500; color: var(--text1); }
.loyal-row-name { font-size: 13px; font-weight: 700; color: var(--text); }
.loyal-row-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; font-weight: 500; }
.loyal-row-badge.ready { background: #ffe8c8; color: #804010; }
.loyal-row-badge.progress { background: #fff4e0; color: #a06010; }
.loyal-row-meta { font-size: 10px; color: var(--text3); line-height: 1.4; }
.loyal-row-actions { display: flex; gap: 4px; flex-shrink: 0; }
.loyal-row-btn { padding: 5px 8px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); white-space: nowrap; }
.loyal-row-btn.issue { background: #d49a3b; border-color: #d49a3b; color: #fff; }
.loyal-row-btn.delete { background: #fdeded; border-color: #f0c4c4; color: #c0503e; }
.loyal-list-footer { padding: 10px 14px; border-top: 1px solid var(--border); text-align: center; }
.loyal-list-count { font-size: 11px; color: var(--text3); }

.action-btns { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.action-btn { padding: 5px 7px; border-radius: 6px; font-size: 10px; cursor: pointer; font-family: 'Noto Sans KR', sans-serif; white-space: nowrap; border: 1px solid var(--border); background: var(--surface2); color: var(--text2); }
.action-btn.call { background: #eef6f1; border-color: #c8e0d0; color: var(--success); }
.action-btn.confirm-o { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
.action-btn.confirm-x { background: var(--danger); border-color: var(--danger); color: #fff; font-weight: 600; }
.action-btn.coming { background: #888; border-color: #888; color: #fff; }
.action-btn.done-label { background: #aaa; border-color: #aaa; color: #fff; cursor: default; }
.action-btn.noshow-label { background: var(--danger); border-color: var(--danger); color: #fff; cursor: default; opacity: 0.7; }
.action-btn.noreply-label { background: var(--warning); border-color: var(--warning); color: #fff; cursor: pointer; opacity: 0.85; }
.action-btn.noreply-label:hover { opacity: 1; }
.action-btn.noreply-label:active { transform: scale(0.97); }
.action-btn.visitx-label { background: #555; border-color: #555; color: #fff; cursor: default; opacity: 0.7; }
.stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.stats-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.stat-mini { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.8rem 1rem; }
.stat-mini-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; }
.stat-mini-val { font-size: 26px; font-weight: 300; color: var(--text); line-height: 1; }
.stat-mini-val.rate { font-size: 22px; }
.stat-mini-unit { font-size: 11px; color: var(--text3); margin-top: 3px; }
.bottom-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1rem; }
.refresh-btn { font-size: 11px; color: var(--text3); background: none; border: none; cursor: pointer; padding: 6px 12px; }
.reset-btn { font-size: 11px; color: var(--danger); background: none; border: 1px solid var(--danger); border-radius: 6px; cursor: pointer; padding: 6px 12px; }
.shuffle-btn { width: 100%; margin-top: 10px; padding: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; color: var(--text2); letter-spacing: 0.05em; transition: background 0.15s; }
.shuffle-btn:hover:not(:disabled) { background: var(--border); }
.shuffle-btn:disabled { opacity: 0.38; cursor: not-allowed; }
.shuffle-result { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem; margin-top: 8px; display: none; }
.shuffle-result.active { display: block; }
.notice-btn { padding: 10px 14px; background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; font-size: 12px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; color: var(--text2); white-space: nowrap; }
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: flex-end; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal-box { background: var(--surface); border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem 0.7rem; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.modal-title { font-size: 14px; font-weight: 600; }
.modal-close-btn { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--text3); padding: 4px 6px; }
.modal-body { overflow-y: auto; padding: 1rem 1.2rem; flex: 1; }
.notice-textarea { width: 100%; min-height: 180px; border: 1px solid var(--border2); border-radius: 8px; padding: 10px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; color: var(--text); background: var(--surface2); resize: vertical; box-sizing: border-box; line-height: 1.6; }
.notice-save-btn { margin-top: 10px; width: 100%; padding: 10px; background: var(--accent,#7c6af7); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; font-weight: 500; }
.shuffle-group { margin-bottom: 0.9rem; }
.shuffle-group:last-child { margin-bottom: 0; }
.shuffle-label { font-size: 10px; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 0.5rem; }
.card-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.card-tag { font-size: 12px; padding: 3px 9px; border-radius: 5px; font-weight: 500; line-height: 1.6; }
.card-tag.black { background: #1a1916; color: #fff; }
.card-tag.red-card { background: #c0503e; color: #fff; }
.card-tag.extra-black { background: #555; color: #fff; }
.card-tag.extra-red { background: #a03428; color: #fff; }
.card-tag.empty-black { background: #3a3835; color: #aaa; font-size: 11px; }
.card-tag.empty-red { background: #5a2820; color: #e07060; font-size: 11px; }
.shuffle-divider { font-size: 10px; color: var(--text3); padding: 0 4px; align-self: center; }
.table-vis-wrap { margin-top: 8px; }
.table-vis { margin-bottom: 10px; }
.table-vis-label { font-size: 10px; color: var(--text3); margin-bottom: 4px; letter-spacing: 0.06em; }
.row-outer, .row-inner { display: flex; gap: 3px; align-items: center; }
.row-inner { margin-top: 2px; padding-left: 13px; }
.seat-spacer { width: 12px; flex-shrink: 0; }
.seat { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 700; flex-shrink: 0; }
.seat.man { background: #1a1916; color: #fff; }
.seat.woman { background: #c0503e; color: #fff; }
.seat.empty-b { background: #3a3835; color: #666; }
.seat.empty-r { background: #5a2820; color: #a06060; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
.dot { display: inline-block; animation: blink 1.2s ease-in-out infinite; color: var(--text3); font-size: 22px; line-height: 1; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
.popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 400; align-items: center; justify-content: center; padding: 1rem; }
.popup-overlay.active { display: flex; }
.popup-box { background: var(--surface); border-radius: 14px; padding: 1.5rem; width: 100%; max-width: 300px; }
.popup-title { font-size: 15px; font-weight: 500; margin-bottom: 0.4rem; }
.popup-sub { font-size: 12px; color: var(--text3); margin-bottom: 1.2rem; }
.popup-btns { display: flex; flex-direction: column; gap: 8px; }
.popup-btn { padding: 11px; border-radius: 8px; border: none; font-size: 13px; font-family: 'Noto Sans KR', sans-serif; cursor: pointer; font-weight: 500; }
.popup-btn.primary { background: var(--accent); color: #fff; }
.popup-btn.warning { background: var(--warning); color: #fff; }
.popup-btn.danger { background: var(--danger); color: #fff; }
.popup-btn.secondary { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <p class="login-title">관리자 로그인</p>
    <p class="login-sub">혼술바 우연 을지로</p>
    <input class="login-input" type="password" id="pwInput" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">로그인</button>
    <p class="login-err" id="loginErr"></p>
  </div>
</div>

<!-- 자리섞기 팝업 -->
<div class="modal-overlay" id="shuffleModal" onclick="closeShuffleModal(event)">
  <div class="modal-box shuffle-modal-box">
    <div class="modal-header">
      <span class="modal-title">🃏 자리 배치</span>
      <button class="modal-close-btn" onclick="closeShuffleModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="shuffle-group">
        <div class="shuffle-label">남자 — 카드</div>
        <div class="card-tags" id="menCards"></div>
      </div>
      <div class="shuffle-group">
        <div class="shuffle-label">여자 — 카드</div>
        <div class="card-tags" id="womenRedCards"></div>
      </div>
      <div class="shuffle-group">
        <div class="shuffle-label">빈 자리</div>
        <div class="card-tags" id="emptyCards"></div>
      </div>
      <div class="shuffle-group" id="tableVisGroup" style="display:none">
        <div class="shuffle-label">테이블 배치</div>

// 자리 표시 매핑: 1=R13, 13=R1, 14=B1, 26=B13. 27+ 는 그대로.
function seatLabel(n) {
  n = parseInt(n);
  if (n >= 1 && n <= 13) return 'R' + (14 - n);
  if (n >= 14 && n <= 26) return 'B' + (n - 13);
  return String(n);
}
function seatNumFromLabel(label) {
  var s = String(label).trim().toUpperCase();
  var m = s.match(/^([RB])\s*(\d+)$/);
  if (!m) return parseInt(s);
  if (m[1] === 'R') return 14 - parseInt(m[2]);
  return parseInt(m[2]) + 13;
}

async function syncSettings() {
  try {
    const r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent('설정!A1:A12')+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
    const d = await r.json();
    if (!d.error && d.values) {
      const gasIsFull = d.values[0] && d.values[0][0] === 'TRUE';
      const gasTM = parseInt(d.values[2] && d.values[2][0]) || 0;
      const gasTF = parseInt(d.values[3] && d.values[3][0]) || 0;
      // A9의 _resetAt 미리 읽기 - race 방어 정밀화에 사용
      let gasResetAtEarly = 0;
      if (d.values[8] && d.values[8][0]) {
        try { gasResetAtEarly = JSON.parse(d.values[8][0])._resetAt || 0; } catch(e) {}
      }
      // race 방어 (정밀화):
      // - 우리가 방금 리셋했고 (recentReset, 60초 이내)
      // - GAS가 아직 우리 리셋 반영 못 했고 (!gasReflectsOurReset)
      // - 우리 로컬은 0인데 GAS는 비제로 → race로 간주, GAS 값 무시
      // 그 외에는 GAS 값을 신뢰 (다른 브라우저 정당한 업데이트 포함)
      const _resetAt = parseInt(localStorage.getItem('lastResetAt') || '0');
      const _resetAge = Date.now() - _resetAt;
      const gasReflectsOurReset = gasResetAtEarly >= _resetAt;
      const localIsZero = (parseInt(seats.tM)||0) === 0 && (parseInt(seats.tF)||0) === 0;
      const gasNotYetZero = gasTM !== 0 || gasTF !== 0;
      const recentReset = _resetAt > 0 && _resetAge < 60000;
      // 방금 자리수를 직접 수정했으면(15초 이내) GAS read가 지연돼 옛 값이 와도 무시.
      // 안 그러면 폴링이 로컬을 옛 값으로 되돌리고 → debounced write가 그 옛 값을 시트에 써버려
      // "수정해도 시트에 반영 안 됨"이 발생한다.
      const seatRecentlyEdited = lastSeatEditAt > 0 && (Date.now() - lastSeatEditAt) < 15000;
      if (recentReset && !gasReflectsOurReset && localIsZero && gasNotYetZero) {
        isFull = false;
      } else if (seatRecentlyEdited) {
        const _tt = (parseInt(seats.tM)||0) + (parseInt(seats.tF)||0);
        isFull = _tt >= TABLE_MAX;
      } else {
        isFull = gasIsFull;
        seats.tM = gasTM;
        seats.tF = gasTF;
        localStorage.setItem('seats', JSON.stringify(seats));
      }
      // A9: 대기목록 상태 동기화 (merge: terminal은 GAS 우선, 나머지는 local 우선)
      if (d.values[8] && d.values[8][0]) {
        try {
          const gasRaw = JSON.parse(d.values[8][0]);
          // 다른 기기에서 초기화 감지
          const gasResetAt = gasRaw._resetAt || 0;
          const localResetAt = parseInt(localStorage.getItem('lastResetAt') || '0');
          if (gasResetAt > localResetAt) {
            // 다른 기기 리셋 감지: itemStates/itemRows만 클리어
            // seats는 위에서 이미 GAS 값으로 동기화됨 (강제 0/0 X)
            itemStates = {};
            itemRows = {};
            localStorage.setItem('itemStates2', '{}');
            localStorage.setItem('itemRows', '{}');
            localStorage.setItem('lastResetAt', gasResetAt);
          } else if (gasResetAt < localResetAt) {
            // 우리가 방금 리셋했는데 GAS A9가 아직 옛 상태를 들고 있음(지연/미반영).
            // A9의 옛 상태를 머지하면 입장완료/미응답 같은 좀비 상태가 되살아나므로 무시하고
            // 로컬(이미 비워진) 상태만 유지한다.
            localStorage.setItem('itemStates2', JSON.stringify(itemStates));
            localStorage.setItem('itemRows', JSON.stringify(itemRows));
          } else {
            const terminal = ['done','noshow','noreply','visitx'];
            const parseState = v => (typeof v==='string' && v.includes('|')) ? v.split('|')[0] : (v||'');
            const parseTs    = v => (typeof v==='string' && v.includes('|')) ? v.split('|')[1] : '';
            const rank = s => terminal.includes(s) ? 2 : s==='coming' ? 1 : 0;
            // Parse gasRaw into clean states, and restore itemRows timestamps for cross-device ghost items
            const gasStates = {};
            Object.keys(gasRaw).forEach(k => {
              if (k === '_resetAt') return;
              const st = parseState(gasRaw[k]);
              const ts = parseTs(gasRaw[k]);
              gasStates[k] = st;
              if (ts && !itemRows[k]) {
                itemRows[k] = ['','',ts,'','','',k,''];
              }
            });
            const merged = Object.assign({}, gasStates);
            Object.keys(itemStates).forEach(k => {
              if (rank(itemStates[k]) >= rank(merged[k])) merged[k] = itemStates[k];
            });
            itemStates = merged;
            localStorage.setItem('itemStates2', JSON.stringify(itemStates));
            localStorage.setItem('itemRows', JSON.stringify(itemRows));
          }
        } catch(e2) {}
      }
      // isFull은 GAS A1 값만 사용 (입력 핸들러가 이미 정확하게 A1을 씀)
      // tTotal 재계산으로 isFull 덮어쓰기 금지 - 리셋 race condition 원인
      // A12: 공지사항 동기화
      if (d.values[11] && d.values[11][0] !== undefined) {
        const gasNotice = d.values[11][0] || '';
        if (gasNotice !== localStorage.getItem('noticeText')) {
          localStorage.setItem('noticeText', gasNotice);
        }
      }

    }
  } catch(e) {}
  // === 좌석 시트 active 손님 수를 자동 카운트해서 tM/tF로 사용 (자리 등록/퇴장 자동 반영) ===
  // seatRecentlyEdited(15초 내 수기 +/-)는 보호 — 그 외엔 좌석 시트가 ground truth
  if (!(lastSeatEditAt > 0 && (Date.now() - lastSeatEditAt) < 15000)) {
    try {
      const sR = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent('좌석!A:F')+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
      const sD = await sR.json();
      if (sD && sD.values) {
        let autoM = 0, autoF = 0;
        for (let i = 1; i < sD.values.length; i++) {
          const row = sD.values[i];
          if (String(row[5]) !== 'active') continue;
          const seat = parseInt(row[4]);
          if (!seat || seat > 26) continue;  // 1~26번만 (바자리 제외)
          if (row[1] === '남성') autoM++;
          else if (row[1] === '여성') autoF++;
        }
        const autoTotal = autoM + autoF;
        const autoIsFull = autoTotal >= TABLE_MAX;
        // 좌석 시트 카운트가 현재 tM/tF와 다르면 자동 동기화
        if (autoM !== (parseInt(seats.tM)||0) || autoF !== (parseInt(seats.tF)||0)) {
          seats.tM = autoM;
          seats.tF = autoF;
          isFull = autoIsFull;
          localStorage.setItem('seats', JSON.stringify(seats));
          // GAS에도 즉시 반영
          try { syncSeatsToGAS(); } catch(e) {}
        }
      }
    } catch(e) {}
  }
  const tMEl = document.getElementById('tM');
  const tFEl = document.getElementById('tF');
  if (tMEl) tMEl.value = seats.tM || 0;
  if (tFEl) tFEl.value = seats.tF || 0;
  updateSeatUI('t', TABLE_MAX);
  updateOpStatusUI();
}

      updateSeatUI('t', TABLE_MAX);
      updateOpStatusUI();
      try { renderList(); } catch(e) {}
      // 2) GAS 호출을 순차 await + keepalive로 모든 요청 송신 보장
      //    (동시 호출 시 일부 dropped되던 버그 수정)
      (async () => {
        const opts = { method: 'GET', mode: 'no-cors', keepalive: true, cache: 'no-store' };
        try { await fetch(GAS_URL + '?type=clearSheet&resetAt=' + resetAt, opts); } catch(e) {}
        // A9 _resetAt 직접 기록 (clearSheet 미반영 대비 → 다른 기기 리셋 감지 보장, 재배포 불필요)
        try { await fetch(GAS_URL + '?type=setItemStates&value=' + encodeURIComponent(JSON.stringify({_resetAt: resetAt})), opts); } catch(e) {}
        try { await fetch(GAS_URL + '?type=setSeatDetail&tM=0&tF=0&bM=0&bF=0', opts); } catch(e) {}
        try { await fetch(GAS_URL + '?type=setSeats&value=26', opts); } catch(e) {}
        try { await fetch(GAS_URL + '?type=setFull&value=FALSE', opts); } catch(e) {}
        // 3) GAS 반영 확인용 동기화
        setTimeout(() => { syncSettings(); loadData(); }, 800);
      })();
    }},
    { label: '취소', cls: 'secondary', action: () => {} }
  ]);
}

function setSeatDirect(id, val) {

  const f = parseInt(fEl.value)||0;
  const other = id.endsWith('M') ? f : m;
  let v = parseInt(val)||0;
  if (v < 0) v = 0;
  if (v + other > TABLE_MAX) v = TABLE_MAX - other;
  const el = document.getElementById(id);
  el.value = v;
  seats[id] = v;
  localStorage.setItem('seats', JSON.stringify(seats));
  updateSeatUI('t', TABLE_MAX);

  isFull = tTotal >= TABLE_MAX;
  updateOpStatusUI();
  syncSeatsToGAS();  // debounce + 순차 + keepalive
}

// 자리수 변경을 GAS에 즉시 동기화 (debounce 제거).
// 이전 300ms debounce가 화근: 입력 후 곧장 새로고침하면 setTimeout 콜백이
// 발사되기 전에 페이지 unload → fetch 자체가 안 일어남 → 시트 미반영 → 폴링이
// 옛 0/0 값으로 다시 덮어씀. 매 입력마다 즉시 keepalive fetch.
function syncSeatsToGAS() {
  const tM = parseInt(seats.tM)||0;
  const tF = parseInt(seats.tF)||0;
  const tTotal = tM + tF;
  const remain = Math.max(TABLE_MAX - tTotal, 0);
  const full = tTotal >= TABLE_MAX;
  const opts = { method: 'GET', mode: 'no-cors', keepalive: true, cache: 'no-store' };
  try { fetch(GAS_URL + '?type=setSeatDetail&tM='+tM+'&tF='+tF+'&bM=0&bF=0', opts).catch(function(){}); } catch(e) {}
  try { fetch(GAS_URL + '?type=setSeats&value=' + remain, opts).catch(function(){}); } catch(e) {}
  try { fetch(GAS_URL + '?type=setFull&value=' + (full ? 'TRUE' : 'FALSE'), opts).catch(function(){}); } catch(e) {}
}
// 안전망: 페이지 unload 직전에도 한 번 더 강제 발송
window.addEventListener('pagehide', function() {
  try { syncSeatsToGAS(); } catch(e) {}
});

function updateSeat(id, delta) {
  lastSeatEditAt = Date.now();

  const fEl = document.getElementById('tF');
  const m = parseInt(mEl.value)||0;
  const f = parseInt(fEl.value)||0;
  if (delta > 0 && m + f >= TABLE_MAX) return;
  const el = document.getElementById(id);
  let val = (parseInt(el.value)||0) + delta;
  if (val < 0) val = 0;
  el.value = val;
  seats[id] = val;
  localStorage.setItem('seats', JSON.stringify(seats));
  updateSeatUI('t', TABLE_MAX);
  const tTotal = (parseInt(seats.tM)||0) + (parseInt(seats.tF)||0);
  isFull = tTotal >= TABLE_MAX;
  updateOpStatusUI();
  syncSeatsToGAS();  // debounce + 순차 + keepalive로 GAS 동기화
}

function updateSeatUI(prefix, max) {
  const mEl = document.getElementById('tM');
  const fEl = document.getElementById('tF');
  const m = parseInt(mEl.value)||0;
  const f = parseInt(fEl.value)||0;
  const total = m + f;
  const remain = Math.max(max - total, 0);
  document.getElementById('tMBar').style.width = Math.min(m/max*100,100) + '%';
  document.getElementById('tFBar').style.width = Math.min(f/max*100,100) + '%';
  document.getElementById('tMetaNums').textContent = '남 '+m+'명 / 여 '+f+'명 / 총 '+total+'명';
  const mP = document.getElementById('tMPlus');
  const fP = document.getElementById('tFPlus');
  if (mP) mP.disabled = total >= max;
  if (fP) fP.disabled = total >= max;
  const el = document.getElementById('tRemain');
  if (remain === 0) { el.textContent = '만석!'; el.className = 'seat-remain full'; }
  else if (remain <= 3) { el.textContent = '남은 자리 '+remain+'명'; el.className = 'seat-remain warn'; }
  else { el.textContent = '남은 자리 '+remain+'명'; el.className = 'seat-remain ok'; }
  // 자리 섞기 버튼: 13명 이상일 때만 활성화
  const shuffleBtn = document.getElementById('shuffleBtn');
  if (shuffleBtn) shuffleBtn.disabled = total < 13;
  // 인원 바뀌면 결과 닫기
  const shuffleResult = document.getElementById('shuffleResult');
  if (shuffleResult) shuffleResult.classList.remove('active');
}

// 단골 GAS POST 공통 함수
function sendLoyalRequest(payload) {
  const body = JSON.stringify(payload);
  let sent = false;
  try {
    if (navigator.sendBeacon) {
      sent = navigator.sendBeacon(GAS_URL, new Blob([body], { type: 'text/plain' }));
    }
  } catch(e) { sent = false; }
  if (!sent) {
    try {
      fetch(GAS_URL, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: body }).catch(()=>{});
    } catch(e) {
      try { fetch(GAS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: body }).catch(()=>{}); } catch(e2) {}
    }
  }
}

function renderCouponBanner() {
  const banner = document.getElementById('couponBanner');
  const list = document.getElementById('couponBannerList');
  if (!banner || !list) return;
  const pending = [];
  Object.keys(loyalMap).forEach(function(phone) {
    const info = loyalMap[phone];
    const visits = info.visits || 0;
    const coupons = info.coupons || 0;
    const earned = Math.floor(visits / 3);
    if (earned > coupons) {
      pending.push({ phone: phone, visits: visits, coupons: coupons, need: earned - coupons });

    banner.style.display = 'none';
    list.innerHTML = '';
    return;

  banner.style.display = 'block';
  list.innerHTML = pending.map(function(p) {

    return '<div class="coupon-banner-item">' +
      '<div class="coupon-banner-info">' +
      '<div class="coupon-banner-phone">' + p.phone + '</div>' +
      '<div class="coupon-banner-meta">누적 ' + p.visits + '회 · 발급 대기 ' + p.need + '장</div>' +
      '</div>' +

let loyalListSort = 'joined';  // joined | visits | pending

function openLoyalList() {

function setLoyalSort(sort) {
  loyalListSort = sort;
  document.querySelectorAll('.loyal-sort-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.sort === sort);
  });

function renderLoyalList() {
  const body = document.getElementById('loyalListBody');
  const countEl = document.getElementById('loyalListCount');
  const searchEl = document.getElementById('loyalSearchInput');
  if (!body) return;
  const query = (searchEl ? searchEl.value : '').replace(/\D/g, '');

  let entries = Object.keys(loyalMap).map(phone => {
    const info = loyalMap[phone];
    const visits = info.visits || 0;
    const coupons = info.coupons || 0;
    const pending = Math.floor(visits / 3) - coupons;
    return {
      phone: phone,
      visits: visits,
      coupons: coupons,
      pending: pending,
      joinedAt: info.joinedAt || '',
      lastVisit: info.lastVisit || '',
      name: info.name || '',
      gender: info.gender || ''
    };
  });

  if (query) {
    entries = entries.filter(e => e.phone.replace(/\D/g, '').includes(query) || (e.name && e.name.includes(query)));
  }

  // 정렬
  if (loyalListSort === 'joined') {
    entries.sort((a, b) => (b.joinedAt || '').localeCompare(a.joinedAt || ''));
  } else if (loyalListSort === 'visits') {
    entries.sort((a, b) => b.visits - a.visits);
  } else if (loyalListSort === 'pending') {
    entries.sort((a, b) => (b.pending - a.pending) || (b.visits - a.visits));
  }

  countEl.textContent = '총 ' + entries.length + '명';

  if (!entries.length) {
    body.innerHTML = '<div class="loyal-list-empty">단골 회원이 없어요</div>';
    return;
  }

  body.innerHTML = entries.map(e => {
    const safe = e.phone.replace(/'/g, "\\'");
    const progress = e.visits % 3;
    const isReady = e.pending > 0;
    const badge = isReady
      ? '<span class="loyal-row-badge ready">🎁 ' + e.pending + '장</span>'
      : '<span class="loyal-row-badge progress">' + progress + '/3</span>';

      + '</div>'
      + '<div class="loyal-row-actions">'
      + issueBtn
      + '<button class="loyal-row-btn delete" onclick="deleteLoyalConfirm(\'' + safe + '\')">삭제</button>'

  }).join('');
}

function getTimeStr(row) {
  const t = row[2]||'';
  if (!t) return '';
  return t.substring(5,10).replace('-','/') + ' ' + t.substring(11,16);
}

function getActionBtns(key, row) {
  const phone = row[6]||'';
  const state = itemStates[key] || null;
  const safeKey = key.replace(/'/g, "\\'");

  if (state === 'done') return `<div class="action-btns"><button class="action-btn done-label">입장완료</button></div>`;
  if (state === 'noshow') return `<div class="action-btns"><button class="action-btn noshow-label">노쇼</button></div>`;
  if (state === 'noreply') return `<div class="action-btns"><button class="action-btn noreply-label" onclick="clickNoreply('${safeKey}')" title="클릭하여 재처리">미응답</button></div>`;
  if (state === 'visitx') return `<div class="action-btns"><button class="action-btn visitx-label">방문X</button></div>`;
  if (state === 'coming') {
    return `<div class="action-btns">
      <button class="action-btn" onclick="sendSMS('${safeKey}')">문자</button>
      <button class="action-btn call" onclick="callGuest('${safeKey}')">전화</button>
      <button class="action-btn coming" onclick="clickComing('${safeKey}')">오는 중</button>
    </div>`;
  }
  return `<div class="action-btns">
    <button class="action-btn" onclick="sendSMS('${safeKey}')">문자</button>
    <button class="action-btn call" onclick="callGuest('${safeKey}')">전화</button>
    <button class="action-btn confirm-o" onclick="clickO('${safeKey}')">O</button>
    <button class="action-btn confirm-x" onclick="clickX('${safeKey}')">X</button>
  </div>`;
}

async function loadData() {
  try {
    const res = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent(RANGE)+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
    const data = await res.json();
    if (data.error) return;
    rawRows = (data.values||[]).slice(1).filter(r => r[6] && r[6].toString().trim() !== '');

    // ── 리셋 이후 스테일 데이터 방어 ──
    // Google Sheets read API는 GAS의 행 삭제 반영이 수 초~수십 초 지연될 수 있어,
    // 초기화 직후 옛 행이 잠깐 되살아난다. 마지막 리셋 시각보다 오래된 타임스탬프의
    // 행은 이미 삭제됐어야 하므로 무시한다. (같은 기기 되살아남 + 다른 기기 동기화 모두 해결)
    const _lastReset = parseInt(localStorage.getItem('lastResetAt') || '0');
    if (_lastReset > 0) {
      const _cutoff = _lastReset - 120000; // 2분 버퍼 (시계 오차/리셋 직후 등록 보호)
      rawRows = rawRows.filter(r => {
        const ts = r[2];
        if (!ts) return true;
        const t = new Date(String(ts).replace(' ', 'T')).getTime();
        if (isNaN(t)) return true;
        return t >= _cutoff;
      });
    }

    const activeKeys = new Set(rawRows.map(r => getKey(r)));
    const greyKeys = Object.keys(itemStates).filter(k =>
      ['done','noshow','noreply','visitx'].includes(itemStates[k]) && !activeKeys.has(k)
    );

    rawRows.forEach(r => { itemRows[getKey(r)] = r; });
    localStorage.setItem('itemRows', JSON.stringify(itemRows));

    // active + ghost 합쳐서 타임스탬프 기준 원래 순서 유지
    const activeItems = rawRows.map(r => ({ row: r, key: getKey(r) }));
    const ghostItems = greyKeys
      .filter(k => !activeItems.find(it => it.key === k))
      .map(k => {
        const savedRow = itemRows[k] || null;
        const phone = k;
        const row = savedRow || ['','','','','','',phone,''];
        return { row, key: k, isGhost: true };
      });
    allItems = [...activeItems, ...ghostItems].sort((a, b) => {
      const tA = a.row[2] || '9999-99-99';
      const tB = b.row[2] || '9999-99-99';
      return tA < tB ? -1 : tA > tB ? 1 : 0;
    });
    allItems.forEach((it, i) => { it._pos = i; });

    starred = starred.filter(k => allItems.some(it => it.key === k));
    hearted = hearted.filter(k => allItems.some(it => it.key === k));
    saveStarred(); saveHearted();

    renderList();
    updateStats();
  } catch(e) {}
}

const removedStates = ['done','noshow','noreply','visitx'];

function updateStats() {
  const active = allItems.filter(it => !removedStates.includes(itemStates[it.key]));
  document.getElementById('totalCount').textContent = active.length;
  document.getElementById('totalPeople').textContent = active.reduce((s,it) => s+(parseInt(it.row[5])||0), 0);
}

// ── 자리 섞기 알고리즘 ──
// === 자리 배치: floor.html의 dynamicSeatPool과 동일 로직 ===
const NUM = { lo:[1,2,4,6,8,10,12], li:[3,5,7,9,11], ro:[13,14,16,18,20,22,24,26], ri:[15,17,19,21,23,25] };
const SEAT_LABEL_MAP_ADMIN = {
  1:'RK', 2:'RA', 3:'BA', 4:'B2', 5:'R2',
  6:'R3', 7:'B3', 8:'B4', 9:'R4', 10:'R5',
  11:'B5', 12:'B6', 13:'R6', 14:'B7', 15:'R7',
  16:'R8', 17:'B8', 18:'B9', 19:'R9', 20:'R10',
  21:'B10', 22:'BJ', 23:'RJ', 24:'RQ', 25:'BQ', 26:'BK'
};
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function getCenterSeatsAdmin(numArr, count) {
  if (count >= numArr.length) return numArr.slice();
  if (count <= 0) return [];
  const mid = (numArr.length - 1) / 2;
  return numArr.map((n, i) => ({ n, i, d: Math.abs(i - mid) }))
    .sort((a, b) => (a.d !== b.d) ? a.d - b.d : a.i - b.i)
    .slice(0, count).sort((a, b) => a.i - b.i).map(x => x.n);
}
function dynamicSeatPoolAdmin(totalM, totalF) {
  // R=여자, B=남자 룰
  const RED_SEATS_A  = new Set([1,2,5,6,9,10,13,15,16,19,20,23,24]);
  const BLUE_SEATS_A = new Set([3,4,7,8,11,12,14,17,18,21,22,25,26]);
  function centerOrderA(arr) {
    if (arr.length <= 1) return arr.slice();
    const mid = (arr.length - 1) / 2;
    return arr.map((v, i) => ({ v, d: Math.abs(i - mid), i }))
      .sort((a, b) => a.d - b.d || a.i - b.i).map(x => x.v);
  }
  function pickTable(outerSeats, innerSeats, m, f) {
    const total = m + f;
    if (total === 0) return { male: [], female: [] };
    const outerC = centerOrderA(outerSeats);
    const innerC = centerOrderA(innerSeats);
    const seatOrder = [];
    for (let i = 0; i < Math.max(outerC.length, innerC.length); i++) {
      if (outerC[i] !== undefined) seatOrder.push(outerC[i]);
      if (innerC[i] !== undefined) seatOrder.push(innerC[i]);
    }
    const chosen = seatOrder.slice(0, total);
    const chosenSet = new Set(chosen);
    const ordered = outerSeats.concat(innerSeats).filter(s => chosenSet.has(s));
    const rSeats = ordered.filter(s => RED_SEATS_A.has(s));
    const bSeats = ordered.filter(s => BLUE_SEATS_A.has(s));
    let male = [], female = [];
    if (f >= rSeats.length) {
      female = rSeats.slice();
      const overflow = f - rSeats.length;
      const bCenter = centerOrderA(bSeats);
      const fInB = new Set(bCenter.slice(0, overflow));
      female = female.concat(bSeats.filter(s => fInB.has(s)));
      male = bSeats.filter(s => !fInB.has(s));
    } else {
      const rCenter = centerOrderA(rSeats);
      const fInR = new Set(rCenter.slice(0, f));
      female = rSeats.filter(s => fInR.has(s));
      male = rSeats.filter(s => !fInR.has(s)).concat(bSeats);
    }
    return { male, female };
  }
  const total = totalM + totalF;
  if (total === 0) return { male: [], female: [], rows: { lo:[], li:[], ro:[], ri:[] } };
  const CAP_L = 12, CAP_R = 14;
  let L = Math.round(total * CAP_L / (CAP_L + CAP_R));
  let R = total - L;
  if (R > CAP_R) { R = CAP_R; L = total - R; }
  if (L > CAP_L) { L = CAP_L; R = total - L; }
  if (L < 0) L = 0;
  if (R < 0) R = 0;
  let leftM = Math.round(totalM * L / total);
  if (L - leftM > totalF) leftM = L - totalF;
  if (leftM < 0) leftM = 0;
  if (leftM > totalM) leftM = totalM;
  if (leftM > L) leftM = L;
  const leftF = L - leftM;
  const rightM = totalM - leftM;
  const rightF = totalF - leftF;
  const leftPick = pickTable(NUM.lo, NUM.li, leftM, leftF);
  const rightPick = pickTable(NUM.ro, NUM.ri, rightM, rightF);
  // row별 M/F/E 배열
  function buildOcc(rowSeats, allMale, allFemale) {
    const setM = new Set(allMale);
    const setF = new Set(allFemale);
    return rowSeats.map(seat => setM.has(seat) ? 'M' : (setF.has(seat) ? 'F' : 'E'));
  }
  const allMale = [].concat(leftPick.male, rightPick.male);
  const allFemale = [].concat(leftPick.female, rightPick.female);
  return {
    male: allMale,
    female: allFemale,
    rows: {
      lo: buildOcc(NUM.lo, allMale, allFemale),
      li: buildOcc(NUM.li, allMale, allFemale),
      ro: buildOcc(NUM.ro, allMale, allFemale),
      ri: buildOcc(NUM.ri, allMale, allFemale)
    }
  };
}
const SEATING_DATA = {};
function showShuffle() {
  const M = parseInt(seats.tM) || 0;
  const F = parseInt(seats.tF) || 0;
  const T = M + F;

  if (T === 0 || T > 26) return;

  // 동적 알고리즘 — floor.html과 동일 로직
  const result = dynamicSeatPoolAdmin(M, F);
  // SEATING_DATA[key] 호환 객체 만들기
  // L_DEF/R_DEF의 각 자리 카드값+색상을 사용해서 mb/mr/fr/fb/eb/er 추출
  const data = { lo: result.rows.lo, li: result.rows.li, ro: result.rows.ro, ri: result.rows.ri };
  const L_DEFS = {
    outer:[['K','red'],['A','red'],['2','blue'],['3','red'],['4','blue'],['5','red'],['6','blue']],
    inner:[['A','blue'],['2','red'],['3','blue'],['4','red'],['5','blue']]
  };
  const R_DEFS = {
    outer:[['6','red'],['7','blue'],['8','red'],['9','blue'],['10','red'],['J','blue'],['Q','red'],['K','blue']],
    inner:[['7','red'],['8','blue'],['9','red'],['10','blue'],['J','red'],['Q','blue']]
  };
  // 카드 분류
  const mb = [], mr = [], fr = [], fb = [], eb = [], er = [];
  function classify(defs, occRow) {
    defs.forEach((cardDef, i) => {
      const card = cardDef[0], color = cardDef[1], who = occRow[i];
      if (who === 'M') (color === 'blue' ? mb : mr).push(card);
      else if (who === 'F') (color === 'red' ? fr : fb).push(card);
      else (color === 'blue' ? eb : er).push(card);
    });
  }
  classify(L_DEFS.outer, data.lo);
  classify(L_DEFS.inner, data.li);
  classify(R_DEFS.outer, data.ro);
  classify(R_DEFS.inner, data.ri);
  data.mb = mb; data.mr = mr;
  data.fr = fr; data.fb = fb;
  data.eb = eb; data.er = er;

  // 카드 태그
  const tag = (n, cls) => `<span class="card-tag ${cls}">${n}</span>`;
  const tagList = (arr, cls) => arr.map(n => tag(n, cls)).join('');
  const sep = `<span class="shuffle-divider">+</span>`;

  document.getElementById('menCards').innerHTML =
    tagList(data.mb, 'black') + (data.mr.length ? sep + tagList(data.mr, 'extra-red') : '');
  document.getElementById('womenRedCards').innerHTML =
    tagList(data.fr, 'red-card') + (data.fb.length ? sep + tagList(data.fb, 'extra-black') : '');
  document.getElementById('emptyCards').innerHTML =
    tagList(data.eb, 'empty-black') + tagList(data.er, 'empty-red');

  // 테이블 배치 시각화
  const L_DEF = {
    outer:[['K','red'],['A','red'],['2','blue'],['3','red'],['4','blue'],['5','red'],['6','blue']],
    inner:[['A','blue'],['2','red'],['3','blue'],['4','red'],['5','blue']]
  };
  const R_DEF = {
    outer:[['6','red'],['7','blue'],['8','red'],['9','blue'],['10','red'],['J','blue'],['Q','red'],['K','blue']],
    inner:[['7','red'],['8','blue'],['9','red'],['10','blue'],['J','red'],['Q','blue']]
  };
  function renderRow(defs, occ) {
    return defs.map(([card,color],i) => {
      const cls = occ[i]==='M'?'man':occ[i]==='F'?'woman':(color==='blue'?'empty-b':'empty-r');
      return `<div class="seat ${cls}">${card}</div>`;
    }).join('');
  }
  document.getElementById('leftTableVis').innerHTML =
    `<div class="row-outer">${renderRow(L_DEF.outer,data.lo)}</div>` +
    `<div class="row-inner"><div class="seat-spacer"></div>${renderRow(L_DEF.inner,data.li)}</div>`;
  document.getElementById('rightTableVis').innerHTML =
    `<div class="row-outer">${renderRow(R_DEF.outer,data.ro)}</div>` +
    `<div class="row-inner"><div class="seat-spacer"></div>${renderRow(R_DEF.inner,data.ri)}</div>`;
  document.getElementById('tableVisGroup').style.display = '';

  document.getElementById('shuffleModal').classList.add('active');
}

function renderList() {
  const el = document.getElementById('waitingList');
  if (!allItems.length) { el.innerHTML = '<div class="waiting-empty">현재 대기 없음</div>'; return; }

  const sorted = [...allItems].sort((a, b) => {
    const aS = starred.includes(a.key);
    const bS = starred.includes(b.key);
    if (aS && !bS) return -1;
    if (!aS && bS) return 1;
    return (a._pos ?? 0) - (b._pos ?? 0);
  });

  let displayNum = 0;
  el.innerHTML = sorted.map(({row, key, isGhost}) => {
    const isStarred = starred.includes(key);
    const isHearted = hearted.includes(key);
    const state = itemStates[key] || null;
    const isGreyed = removedStates.includes(state);
    const isComing = state === 'coming';
    const gender = row[4]||'';
    const gClass = gender==='남성'?'male':'female';
    const seat = row[7]||'테이블석';

    if (!isGreyed) displayNum++;

    let itemClass = '';
    if (isGreyed) itemClass = 'greyed';
    else if (isComing) itemClass = 'coming-state';
    else if (isHearted) itemClass = 'hearted';

    const safeKey = key.replace(/'/g, "\\'");

    return `<div class="waiting-item ${itemClass}">
      <div class="icon-btns">
        <button class="star-btn ${isStarred?'active':''}" onclick="toggleStar('${safeKey}')">★</button>
        <button class="heart-btn ${isHearted?'active':''}" onclick="toggleHeart('${safeKey}')">♥</button>
      </div>
      <span class="waiting-num">${isGreyed ? '—' : displayNum}</span>
      <div class="waiting-info">
        <div class="name-row">
          ${row[3] ? `<span class="cust-name">${escHtml(row[3])}</span>` : ''}
          ${gender ? `<span class="gender-badge ${gClass}">${gender}</span>` : ''}
          ${getSeatBadge(seat)}
          ${getLoyalBadge(row[6])}
        </div>
        <p class="waiting-meta">${row[5]?row[5]+'명 · ':''}${getTimeStr(row)}${row[6]?' · '+row[6]:''}</p>
      </div>
      ${getActionBtns(key, row)}
    </div>`;
  }).join('');
}
