<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우연 — 자리 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f7f6f4; --surface: #ffffff; --surface2: #f2f1ef;
  --border: #e8e6e2; --border2: #d8d6d2;
  --text: #1a1916; --text2: #6e6b66; --text3: #a8a49e;
  --accent: #1a1916; --danger: #c0503e; --success: #4a8c5c;
  --male: #2a5fa8; --maleBg: #eef3fb; --female: #b54a7a; --femaleBg: #fbeef4;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); padding: 1rem 1rem 4rem; }
.wrap { max-width: 760px; margin: 0 auto; }
.hidden { display: none !important; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0 1rem; }
.top h1 { font-size: 17px; font-weight: 700; }
.top .meta { font-size: 12px; color: var(--text2); }
.bar { display: flex; gap: 8px; margin-bottom: 1rem; }
.btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:active { transform: scale(0.98); }

.table-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.9rem; overflow-x: auto; }
.seat-row { width: max-content; }
.table-title { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 0.7rem; }
.seat-row { display: flex; gap: 6px; }
.table-flow { display: flex; align-items: center; gap: 6px; width: max-content; }
.rows { display: flex; flex-direction: column; gap: 6px; }
.seat-row.off1 { padding-left: calc(46px + 6px); } /* 오른쪽 안쪽줄을 14번 아래로 정렬 */
.seat { cursor: pointer; position: relative; width: 46px; height: 58px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.seat .n { font-size: 11px; color: var(--text3); line-height: 1; }
.seat .id { font-size: 13px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.seat .t { font-size: 9px; color: var(--text3); margin-top: 1px; line-height: 1; }
.seat.overdue { background: #fdecea !important; border-color: #e8a89e !important; }
.seat.overdue .t { color: var(--danger); font-weight: 700; }
.seat.urgent { animation: seatBlink 0.9s ease-in-out infinite; z-index: 1; position: relative; }
@keyframes seatBlink {
  0%, 100% { box-shadow: 0 0 0 0 rgba(192, 80, 62, 0); transform: scale(1); }
  50%      { box-shadow: 0 0 0 5px rgba(192, 80, 62, 0.75); transform: scale(1.05); }
}
.m-hist { font-size: 12px; color: var(--text2); line-height: 1.7; background: var(--surface2); border-radius: 8px; padding: 8px 10px; margin: 0.4rem 0 0.2rem; }
.m-hist .h-row b { color: var(--text); }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.seat.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
.seat.dup { outline: 2px solid var(--danger); outline-offset: -1px; }
.manual-hint { font-size: 12px; color: var(--accent); font-weight: 500; background: #eef0f5; border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; margin-bottom: 0.8rem; }
.seat .pinmark { position: absolute; top: -5px; right: -5px; min-width: 15px; height: 15px; line-height: 15px; padding: 0 3px; border-radius: 8px; color: #fff; font-size: 9px; font-weight: 700; text-align: center; }
.m-order { width: 100%; margin-top: 0.8rem; padding: 12px; background: var(--success); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.seat.m { background: var(--maleBg); border-color: #c3d4ee; }
.seat.m .id { color: var(--male); }
.seat.f { background: var(--femaleBg); border-color: #eecada; }
.seat.f .id { color: var(--female); }
.seat.empty .id { color: var(--text3); font-weight: 400; font-size: 11px; }
.hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal-bg.on { display: flex; }
.modal-card { background: var(--surface); border-radius: 14px; padding: 1.4rem; width: 100%; max-width: 320px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 0.8rem; }
.m-label { font-size: 11px; color: var(--text3); margin: 0.7rem 0 6px; }
.m-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 18px; letter-spacing: 0.1em; font-family: inherit; outline: none; }
.m-gender { display: flex; gap: 8px; }
.m-gbtn { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 15px; color: var(--text2); cursor: pointer; }
.m-gbtn.sel-m { background: var(--maleBg); border-color: var(--male); color: var(--male); font-weight: 500; }
.m-gbtn.sel-f { background: var(--femaleBg); border-color: var(--female); color: var(--female); font-weight: 500; }
.m-btns { display: flex; gap: 8px; margin-top: 1.2rem; }
.m-btns .btn { margin-top: 0; }
.m-leave { width: 100%; margin-top: 10px; padding: 10px; background: none; border: none; color: var(--danger); font-family: inherit; font-size: 13px; cursor: pointer; }
.floor-login { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 1rem; }
.floor-login .lbox { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 2rem 1.6rem; width: 100%; max-width: 300px; text-align: center; }
.floor-login h2 { font-size: 17px; font-weight: 700; margin-bottom: 1rem; }
.floor-login input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; text-align: center; letter-spacing: 0.2em; outline: none; margin-bottom: 10px; font-family: inherit; }
.floor-login button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-family: inherit; cursor: pointer; }
.floor-login .err { color: var(--danger); font-size: 12px; margin-top: 8px; min-height: 14px; }
.pair-status { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.9rem; margin-bottom: 0.9rem; font-size: 13px; }
.ps-head { font-size: 11px; color: var(--text3); letter-spacing: 0.05em; margin-bottom: 6px; }
.ps-list { display: flex; flex-wrap: wrap; gap: 6px; }
.ps-item { padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 500; }
.ps-item.mutual { background: #e7f4ec; color: #2d6e3f; border: 1px solid #b8dec5; }
.ps-item.oneway { background: var(--surface2); color: var(--text2); border: 1px solid var(--border); }
/* === Apple 다크 톤 게임 패널 (시스템 컬러 기반) === */
.btn.game-start { background: #0a84ff; color: #fff; border: none; font-weight: 600; font-size: 17px; padding: 14px; border-radius: 12px; letter-spacing: -0.01em; }
.game-panel { background: #1c1c1e; color: #f5f5f7; border: none; border-radius: 18px; max-height: 0; overflow: hidden; padding: 0 1.4rem; margin-top: 0; transition: max-height 0.5s cubic-bezier(0.4,0,0.2,1), padding 0.3s ease, margin-top 0.3s ease; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Noto Sans KR', sans-serif; -webkit-font-smoothing: antialiased; }
.game-panel.on { max-height: 3000px; padding: 1.5rem 1.4rem 1.3rem; margin-top: 0.7rem; }
.gp-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.3rem; }
.gp-header-left { display: flex; align-items: baseline; gap: 14px; }
.gp-label-tag { font-size: 11px; color: #86868b; letter-spacing: 0.06em; font-weight: 500; text-transform: uppercase; }
.gp-state { font-size: 28px; font-weight: 600; color: #f5f5f7; letter-spacing: -0.02em; line-height: 1; }
.gp-round-badge { font-size: 13px; color: #86868b; font-weight: 500; }
.gp-teams { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 1.4rem; }
.gp-team { border-radius: 14px; padding: 14px; font-size: 13px; background: #2c2c2e; border: none; }
.gp-team[data-team="1"] b { color: #ff453a; }
.gp-team[data-team="2"] b { color: #0a84ff; }
.gp-team[data-team="3"] b { color: #30d158; }
.gp-team[data-team="4"] b { color: #ffd60a; }
.gp-team[data-team="5"] b { color: #bf5af2; }
.gp-team[data-team="6"] b { color: #ff9f0a; }
.gp-team b { display: block; font-size: 17px; margin-bottom: 4px; font-weight: 600; letter-spacing: -0.01em; }
.gp-team .seats { color: #aeaeb2; font-size: 13px; line-height: 1.3; font-weight: 400; }
.gp-score-input { display: flex; align-items: center; gap: 12px; margin-bottom: 1.4rem; padding: 14px 16px; background: #2c2c2e; border-radius: 14px; }
.gp-score-input label { font-size: 15px; color: #f5f5f7; font-weight: 400; }
.gp-score-input input { width: 60px; padding: 8px; background: #1c1c1e; border: none; border-radius: 8px; color: #f5f5f7; font-size: 17px; font-weight: 600; text-align: center; font-family: inherit; }
.gp-buzzed { background: #ff453a; color: #fff; padding: 22px; border-radius: 18px; text-align: center; margin-bottom: 1.1rem; font-size: 15px; font-weight: 500; animation: gpPulse 1.6s ease-in-out infinite; letter-spacing: -0.01em; }
.gp-buzzed .big { font-size: 56px; color: #fff; display: block; margin-top: 6px; line-height: 1; font-weight: 600; letter-spacing: -0.04em; }
.gp-buzzed .big small { font-size: 22px; color: #fff; opacity: 0.7; margin-left: 6px; font-weight: 400; }
@keyframes gpPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.92; } }
.gp-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 0.7rem; }
.gp-actions button { padding: 16px; border-radius: 14px; border: none; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer; color: #fff; transition: opacity 0.15s; letter-spacing: -0.01em; }
.gp-actions button:active { opacity: 0.7; }
.gp-actions .correct { background: #30d158; }
.gp-actions .wrong { background: #ff453a; }
.gp-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gp-btns button { padding: 14px 8px; border-radius: 12px; border: none; background: #2c2c2e; color: #f5f5f7; font-family: inherit; font-size: 15px; cursor: pointer; font-weight: 500; transition: opacity 0.15s; letter-spacing: -0.01em; }
.gp-btns button:active { opacity: 0.7; }
.gp-btns button.primary { background: #0a84ff; color: #fff; font-weight: 600; }
.gp-btns button.danger { color: #ff453a; background: #2c2c2e; }
.gp-btns button.reset { color: #ff9f0a; background: #2c2c2e; }
.gp-scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; margin-top: 1.1rem; padding-top: 1.1rem; border-top: 1px solid rgba(84,84,88,0.4); }
.gp-score-item { background: #2c2c2e; border: none; border-radius: 12px; padding: 12px 6px; text-align: center; font-size: 12px; color: #aeaeb2; position: relative; font-weight: 500; }
.gp-score-item b { display: block; font-size: 28px; color: #f5f5f7; font-weight: 600; margin-bottom: 2px; letter-spacing: -0.02em; }
.gp-score-item.top { background: #1a3a5c; }
.gp-score-item.top::before { content: ''; }
.gp-score-item.top b { color: #0a84ff; }
.gp-score-item.top::after { content: '1st'; position: absolute; top: 4px; right: 6px; font-size: 9px; color: #0a84ff; font-weight: 600; letter-spacing: 0.05em; }
.gp-pen { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 0.7rem; font-size: 12px; }
.gp-pen-tag { background: rgba(255,69,58,0.15); color: #ff453a; padding: 4px 10px; border-radius: 8px; font-weight: 500; letter-spacing: -0.01em; }
@media (max-width: 680px){
  .seat-row { gap: 4px; }
  .seat-row.off1 { padding-left: calc(38px + 4px); }
  .seat { width: 38px; height: 48px; }
  .seat .n { font-size: 9px; }
  .seat .id { font-size: 11px; }
  .seat .t { font-size: 8px; }
  .top h1 { font-size: 16px; }
  .bar .btn { font-size: 12px; padding: 10px 6px; }
}
</style>
</head>
<body>
<div class="floor-login" id="floorLogin">
  <div class="lbox">
    <h2>자리 관리 로그인</h2>
    <input type="password" id="floorPw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doFloorLogin()">
    <button onclick="doFloorLogin()">로그인</button>
    <div class="err" id="floorErr"></div>
  </div>
</div>
<div class="wrap">
  <div class="top">
    <h1>우연 — 자리 관리</h1>
    <div class="meta" id="meta">—</div>
  </div>
  <div class="bar">
    <button class="btn" onclick="loadSeats()">↻ 새로고침</button>
    <button class="btn" id="manualBtn" onclick="toggleManual()">✋ 수동 이동</button>
    <button class="btn" id="pairBtn" onclick="togglePair()">🔗 같이 앉기</button>
    <button class="btn primary" onclick="doMove()">🔀 자리 이동</button>
  </div>
  <div id="manualHint" class="manual-hint hidden">수동 이동 켜짐 — 옮길 손님 자리를 누른 뒤, 보낼 자리를 누르세요. (둘 다 손님이면 서로 교환)</div>
  <div id="pairHint" class="manual-hint hidden">같이 앉기 켜짐 — 함께 앉힐 두 손님 자리를 차례로 누르세요. 다시 누르면 해제. (다음 자리 이동부터 반영)</div>
  <div id="shuffleInfo" class="hint" style="cursor:pointer;margin-bottom:0.7rem" onclick="showShuffleTimes()"></div>
  <div id="pairStatus" class="pair-status hidden"></div>

  <div class="table-block">
    <div class="table-title">안쪽 테이블 (1~12)</div>
    <div class="table-flow">
      <div class="seat-row" id="L_cap"></div>
      <div class="rows">
        <div class="seat-row" id="L_outer"></div>
        <div class="seat-row" id="L_inner"></div>
      </div>
    </div>
  </div>
  <div class="table-block">
    <div class="table-title">입구쪽 테이블 (13~26)</div>
    <div class="table-flow">
      <div class="rows">
        <div class="seat-row" id="R_outer"></div>
        <div class="seat-row off1" id="R_inner"></div>
      </div>
      <div class="seat-row" id="R_cap"></div>
    </div>
  </div>
  <div class="table-block">
    <div class="table-title">바 자리 (27~32)</div>
    <div class="seat-row" id="B_bar"></div>
  </div>
  <div class="hint">남자=파랑 / 여자=분홍. 칸 안 숫자는 자리번호, 큰 글씨는 손님 뒷4자리. (칸을 누르면 수동 등록/수정)</div>

  <div style="margin-top: 1.5rem;">
    <button class="btn game-start" onclick="toggleGame()" id="gameToggleBtn">🎮 게임 시작</button>
  </div>
  <div id="gamePanel" class="game-panel">
    <div class="gp-header">
      <div class="gp-header-left">
        <span class="gp-label-tag">GAME</span>
        <span class="gp-state" id="gpState">대기</span>
      </div>
      <span class="gp-round-badge" id="gpRoundBadge" style="display:none">라운드 1</span>
    </div>
    <div class="gp-teams" id="gpTeams"></div>
    <div class="gp-score-input">
      <label>현재 배점:</label>
      <input type="number" id="gpScore" value="1" min="1" max="10" onchange="updateScore()">
      <span style="font-size:11px;color:#888">점</span>
    </div>
    <div id="gpBuzzedBox" class="gp-buzzed hidden">
      🎤 정답 도전
      <span class="big"><span id="gpBuzzedTeam">-</span><small>조</small></span>
    </div>
    <div id="gpActions" class="gp-actions hidden">
      <button class="correct" onclick="markCorrect()">⭕ 정답 (+<span id="gpActionScore">1</span>)</button>
      <button class="wrong" onclick="markWrong()">❌ 오답</button>
    </div>
    <div class="gp-btns">
      <button id="gpPracticeBtn" onclick="togglePractice()">🎯 연습 시작</button>
      <button class="primary" id="gpRoundBtn" onclick="startRound()">🏁 라운드 시작</button>
      <button class="danger" onclick="endGame()">🏁 종료</button>
      <button class="reset" onclick="resetGame()">🔄 강제 리셋</button>
    </div>
    <div id="gpPenalties" class="gp-pen"></div>
    <div class="gp-scores" id="gpScores"></div>
  </div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-title"><span id="mSeat">—</span>번 자리</div>
    <div class="m-label">전화번호 뒷 4자리</div>
    <input class="m-input" id="mId" type="tel" inputmode="numeric" maxlength="4" placeholder="0000">
    <div class="m-label">성별</div>
    <div class="m-gender">
      <button class="m-gbtn" id="mgM" onclick="mPick('남성')">남성</button>
      <button class="m-gbtn" id="mgF" onclick="mPick('여성')">여성</button>
    </div>
    <div class="m-hist hidden" id="mHist"></div>
    <button class="m-order hidden" id="mOrder" onclick="orderDone()">✓ 추가주문 완료 (90분 리셋)</button>
    <div class="m-btns">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" onclick="registerManual()">등록 / 수정</button>
    </div>
    <button class="m-leave hidden" id="mLeave" onclick="leaveManual()">이 자리 비우기 (퇴장)</button>
  </div>
</div>

<script>
// 자리 표시 매핑: 1=R13, 13=R1, 14=B1, 26=B13. 27+ 는 그대로.
function seatLabel(n) {
  n = parseInt(n);
  if (n >= 1 && n <= 13) return 'R' + (14 - n);
  if (n >= 14 && n <= 26) return 'B' + (n - 13);
  return String(n);
}
function seatNumFromLabel(label) {
  var s = String(label).trim().toUpperCase();
  var m = s.match(/^([RB])\s*(\d+)$/);
  if (!m) return parseInt(s);
  if (m[1] === 'R') return 14 - parseInt(m[2]);
  return parseInt(m[2]) + 13;
}

const SHEET_ID = '1NmPb6wxX0usqeP-gd7cFQPgHecLQsCYcA3i3wcU3uwc';
const API_KEY = 'AIzaSyDNs6DjFlPRHukWl572r1pMZV72F6ZtODI';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzvIfxTPJVZUfjED-3XwLcHKRfbHouWLVFh9grynew8FdjUavr5nikX5wJMDdcYf1vH/exec';

// 자리번호 매핑 (서→동)
const ROWS = {
  L_cap: [1],
  L_outer: [2,4,6,8,10,12],
  L_inner: [3,5,7,9,11],
  R_outer: [13,14,16,18,20,22,24],
  R_inner: [15,17,19,21,23,25],
  R_cap: [26],
  B_bar: [27,28,29,30,31,32]
};
// SEATING_DATA[key].lo/li/ro/ri 순서에 대응하는 자리번호
const NUM = { lo:[1,2,4,6,8,10,12], li:[3,5,7,9,11], ro:[13,14,16,18,20,22,24,26], ri:[15,17,19,21,23,25] };
// 이웃 지도: 같은 테이블 & (같은줄 옆칸 | 마주보는 줄 열차이 1이내)
const COLS = {1:0,2:1,4:2,6:3,8:4,10:5,12:6,3:1,5:2,7:3,9:4,11:5,13:0,14:1,16:2,18:3,20:4,22:5,24:6,26:7,15:1,17:2,19:3,21:4,23:5,25:6};
const OUTERSET = new Set([1,2,4,6,8,10,12,13,14,16,18,20,22,24,26]);
const ALLSEATS = Object.keys(COLS).map(Number);

function seatsByGender(key){
  const d = SEATING_DATA[key]; if(!d) return null;
  const out = { male:[], female:[] };
  ['lo','li','ro','ri'].forEach(function(rk){
    d[rk].forEach(function(v,idx){
      if(v==='M') out.male.push(NUM[rk][idx]);
      else if(v==='F') out.female.push(NUM[rk][idx]);
    });
  });
  return out;
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

async function loadSeats(){
  try {
    const r = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent('좌석!A:J')+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
    const d = await r.json();
    occ = {};
    var seatCount = {};
    if (d && d.values) {
      for (let i=1;i<d.values.length;i++){
        const row = d.values[i];
        if (String(row[5]) !== 'active') continue;
        const seat = parseInt(row[4]);
        if (!seat) continue;
        let hist = []; try { hist = JSON.parse(row[7]||'[]'); } catch(eh) { hist = []; }
        var wantPair = row[9] ? parseInt(row[9]) : 0;
        seatCount[seat] = (seatCount[seat]||0) + 1;
        occ[seat] = { id: String(row[0]||'').padStart(4,'0'), gender: String(row[1]||''), enter: String(row[2]||''), lastOrder: String(row[3]||''), history: hist, wantPair: wantPair };
      }
    }
    dupSet = new Set(Object.keys(seatCount).filter(function(k){return seatCount[k]>1;}).map(Number));
  } catch(e) { occ = {}; dupSet = new Set(); }
  try {
    const r2 = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent('설정!A13')+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
    const d2 = await r2.json();
    cumLeave = (d2 && d2.values && d2.values[0] && d2.values[0][0]) ? (parseInt(d2.values[0][0])||0) : 0;
  } catch(e) {}
  renderBoard();
}

function renderBoard(){
  var pinOf = {}; pins.forEach(function(pp,i){ pinOf[pp[0]] = i+1; pinOf[pp[1]] = i+1; });
  var PINCOL = ['#e0533e','#2a7ac0','#4a8c5c','#b54a7a','#c98a1a','#7a5cc0','#1aa3a3','#9a6b2e'];
  Object.keys(ROWS).forEach(function(rid){
    const el = document.getElementById(rid);
    el.innerHTML = ROWS[rid].map(function(n){
      const o = occ[n];
      let cls = o ? (o.gender==='남성'?'m':o.gender==='여성'?'f':'') : 'empty';
      const idTxt = o ? o.id : '빈자리';
      let tHtml = '';
      if (o) { const em = elapsedMin(o.lastOrder); if (em!=null) { if (em>=80) cls += ' overdue'; if (em>=90) cls += ' urgent'; tHtml = '<span class="t">'+em+'분</span>'; } }
      if ((manualMode && selA===n) || (pairMode && (pinSelA===n || pinSelB===n))) cls += ' sel';
      if (dupSet.has(n)) cls += ' dup';
      var pinHtml = ''; if (o && pinOf[n]) { var pc = PINCOL[(pinOf[n]-1) % PINCOL.length]; pinHtml = '<span class="pinmark" style="background:'+pc+'">'+pinOf[n]+'</span>'; }
      return '<div class="seat '+cls+'" onclick="onSeatClick('+n+')">'+pinHtml+'<span class="n">'+seatLabel(n)+'</span><span class="id">'+idTxt+'</span>'+tHtml+'</div>';
    }).join('');
  });
  const list = Object.values(occ);
  const m = list.filter(o=>o.gender==='남성').length;
  const f = list.filter(o=>o.gender==='여성').length;
  const over = list.filter(function(o){var e=elapsedMin(o.lastOrder);return e!=null&&e>=80;}).length;
  document.getElementById('meta').textContent = '착석 '+list.length+'명 (남'+m+'/여'+f+')'+(over?' · 🔴'+over:'')+' · 영업누적 '+cumLeave+'명';
  var sInfo = document.getElementById('shuffleInfo'); if (sInfo) sInfo.textContent = shuffleLog.length ? ('🔀 이번 영업 자리 이동 '+shuffleLog.length+'회 · 마지막 '+shuffleLog[shuffleLog.length-1]+' (탭: 전체 시각)') : '🔀 이번 영업 자리 이동 없음';
  renderPairStatus();
}

function renderPairStatus(){
  var panel = document.getElementById('pairStatus');
  if (!panel) return;
  // 모든 신청 수집
  var reqs = [];
  Object.entries(occ).forEach(function(e){
    var from = parseInt(e[0]);
    var w = e[1].wantPair;
    if (w) reqs.push([from, w]);
  });
  if (!reqs.length) { panel.classList.add('hidden'); panel.innerHTML = ''; return; }
  // 상호/일방향 분류
  var mutualKeys = new Set();
  var seenMutual = new Set();
  var oneWay = [];
  reqs.forEach(function(r){
    var rev = reqs.find(function(rr){ return rr[0] === r[1] && rr[1] === r[0]; });
    if (rev) {
      var key = Math.min(r[0],r[1])+'-'+Math.max(r[0],r[1]);
      mutualKeys.add(key);
    }
  });
  var items = [];
  reqs.forEach(function(r){
    var key = Math.min(r[0],r[1])+'-'+Math.max(r[0],r[1]);
    if (mutualKeys.has(key)) {
      if (!seenMutual.has(key)) {
        seenMutual.add(key);
        items.push({ type:'mutual', a: Math.min(r[0],r[1]), b: Math.max(r[0],r[1]) });
      }
    } else {
      items.push({ type:'oneway', a: r[0], b: r[1] });
    }
  });
  // 상호 먼저 정렬
  items.sort(function(a,b){ if (a.type!==b.type) return a.type==='mutual'?-1:1; return a.a-b.a; });
  var mCnt = items.filter(function(x){return x.type==='mutual';}).length;
  var oCnt = items.filter(function(x){return x.type==='oneway';}).length;
  var html = '<div class="ps-head">🔗 같이앉기 신청 · 상호 '+mCnt+'쌍 · 일방향 '+oCnt+'건</div><div class="ps-list">';
  html += items.map(function(x){
    if (x.type==='mutual') return '<span class="ps-item mutual">'+x.a+' ↔ '+x.b+' ✓</span>';
    return '<span class="ps-item oneway">'+x.a+' → '+x.b+'</span>';
  }).join('');
  html += '</div>';
  panel.innerHTML = html;
  panel.classList.remove('hidden');
}

function doMove(){
  // 사람을 "현재 자리(from)"로 식별 → 같은 뒷자리 중복이어도 안 엉킴
  const persons = Object.entries(occ).filter(function(e){ return parseInt(e[0]) <= 26; }).map(function(e){ return { from: parseInt(e[0]), id: e[1].id, gender: e[1].gender }; });
  if (!persons.length) { alert('착석한 손님이 없어요.'); return; }
  const M = persons.filter(p=>p.gender==='남성').length;
  const F = persons.filter(p=>p.gender==='여성').length;
  const key = 'M'+M+'_F'+F;
  const sg = seatsByGender(key);
  if (!sg) { alert('이 인원 조합('+key+')은 배치표에 없어요. 인원/성별을 확인해주세요.'); return; }
  const males = persons.filter(p=>p.gender==='남성');
  const females = persons.filter(p=>p.gender==='여성');
  const occSeats = new Set(persons.map(p=>p.from));
  const apins = pins.filter(function(p){ return occSeats.has(p[0]) && occSeats.has(p[1]); });

  // 손님 상호 짝 신청 (좌석 J열 wantPair): A→B && B→A 인 페어만 이번 셔플 한정 핀에 추가
  var mutualPairs = [];
  Object.entries(occ).forEach(function(e){
    var a = parseInt(e[0]);
    var w = e[1].wantPair;
    if (!w || a >= w) return; // 중복 방지, a < w 만 처리
    if (a > 26 || w > 26) return; // 바자리는 제외
    if (occ[w] && occ[w].wantPair === a) {
      // 기존 apins/mutualPairs에 이미 있는지 체크
      var already = apins.some(function(p){ return (p[0]===a&&p[1]===w)||(p[0]===w&&p[1]===a); });
      if (!already) mutualPairs.push([a, w]);
    }
  });
  mutualPairs.forEach(function(p){ apins.push(p); });

  function assignOnce(){ var sm=shuffle(sg.male), sf=shuffle(sg.female), pos={}; males.forEach(function(p,i){ pos[p.from]=sm[i]; }); females.forEach(function(p,i){ pos[p.from]=sf[i]; }); return pos; }
  function npairsOf(pos){ var seat2id={}; persons.forEach(function(p){ seat2id[pos[p.from]]=p.id; }); var set=new Set(); persons.forEach(function(p){ NB[pos[p.from]].forEach(function(s2){ var oid=seat2id[s2]; if(oid) set.add([p.id,oid].sort().join('|')); }); }); return set; }
  function scoreOf(pos){ var rep=0; npairsOf(pos).forEach(function(pp){ if(neighborHist.has(pp)) rep++; }); var v=0; apins.forEach(function(pr){ var a=pos[pr[0]], b=pos[pr[1]]; var sameG = occ[pr[0]] && occ[pr[1]] && occ[pr[0]].gender===occ[pr[1]].gender; var ok = sameG ? isDiag(a,b) : (NB[a].indexOf(b)>=0); if(!ok) v++; }); return v*1000 + rep; }
  var best=null, bs=Infinity;
  for (var k=0;k<800;k++){ var pos=assignOnce(); var sc=scoreOf(pos); if(sc<bs){ bs=sc; best=pos; } if(bs===0) break; }
  var unmet = apins.filter(function(pr){ var a=best[pr[0]], b=best[pr[1]]; var sameG = occ[pr[0]] && occ[pr[1]] && occ[pr[0]].gender===occ[pr[1]].gender; var ok = sameG ? isDiag(a,b) : (NB[a].indexOf(b)>=0); return !ok; }).length;

  var msg = persons.length+'명의 자리를 새로 배정할까요?\n(최대한 새로운 이웃과 앉도록 섞어요)';

// 분조 알고리즘 (테이블 우선)
function assignTeams(seats, numTeams) {
  const tables = [
    seats.filter(s => s <= 12).sort((a,b)=>a-b),
    seats.filter(s => s >= 13 && s <= 26).sort((a,b)=>a-b),
    seats.filter(s => s >= 27).sort((a,b)=>a-b),
  ].filter(t => t.length > 0);
  const total = seats.length;
  if (numTeams > total) numTeams = total;
  if (numTeams < 1) numTeams = 1;
  let teamCount = tables.map(t => Math.max(1, Math.round(t.length / total * numTeams)));
  let sum = teamCount.reduce((a,b)=>a+b, 0);
  while (sum > numTeams) {
    let idx = -1, minC = Infinity;
    teamCount.forEach((c, i) => { if (c > 1 && c < minC) { minC = c; idx = i; } });
    if (idx === -1) break;
    teamCount[idx]--; sum--;
  }
  while (sum < numTeams) {
    let idx = 0, maxR = -1;
    tables.forEach((t, i) => { const r = t.length / teamCount[i]; if (r > maxR) { maxR = r; idx = i; } });
    teamCount[idx]++; sum++;
  }
  const result = {};
  let nextTeam = 1;
  tables.forEach((s, i) => {
    const k = teamCount[i];
    const base = Math.floor(s.length / k);
    const extra = s.length % k;
    let idx = 0;
    for (let t = 0; t < k; t++) {
      const cnt = base + (t < extra ? 1 : 0);
      for (let j = 0; j < cnt; j++) result[s[idx++]] = nextTeam;
      nextTeam++;
    }
  });
  return { teams: result, teamCount: numTeams };
}

  const scores = v.scores || {};
  const teamCount = v.teamCount || 0;
  let max = -1, leaders = [];
  for (let t = 1; t <= teamCount; t++) {
    const s = scores[t] || 0;
    if (s > max) { max = s; leaders = [t]; }
    else if (s === max) leaders.push(t);

  if (leaders.length === 1) {
    setTimeout(() => {
      gRef.update({ state: 'gameover', champion: leaders[0], winner: null });
      // 우승 발표 후 자동 정리 — 20초 뒤 게임 노드 완전 제거

let aCtx = null;

function sndBuzz() {
  ensA(); if (!aCtx) return;
  const c = aCtx, n = c.currentTime;
  const o1 = c.createOscillator(), o2 = c.createOscillator(), g = c.createGain();
  o1.connect(g); o2.connect(g); g.connect(c.destination);
  o1.type='square'; o2.type='square'; o1.frequency.value=220; o2.frequency.value=110;
  g.gain.setValueAtTime(0,n); g.gain.linearRampToValueAtTime(0.55,n+0.02);
  g.gain.setValueAtTime(0.55,n+0.5); g.gain.exponentialRampToValueAtTime(0.001,n+0.75);
  o1.start(n); o2.start(n); o1.stop(n+0.75); o2.stop(n+0.75);
}
function sndCorrect() {
  ensA(); if (!aCtx) return;
  const c = aCtx, n = c.currentTime;
  [523, 659, 784].forEach((f, i) => {
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.frequency.value = f; o.type='sine';
    const s = n + i*0.13;
    g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.5, s+0.02);
