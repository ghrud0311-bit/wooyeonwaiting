<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우연 — 자리 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f7f6f4; --surface: #ffffff; --surface2: #f2f1ef;
  --border: #e8e6e2; --border2: #d8d6d2;
  --text: #1a1916; --text2: #6e6b66; --text3: #a8a49e;
  --accent: #1a1916; --danger: #c0503e; --success: #4a8c5c;
  --male: #2a5fa8; --maleBg: #eef3fb; --female: #b54a7a; --femaleBg: #fbeef4;
}
body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); padding: 1rem 1rem 4rem; }
.wrap { max-width: 760px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0 1rem; }
.top h1 { font-size: 17px; font-weight: 700; }
.top .meta { font-size: 12px; color: var(--text2); }
.bar { display: flex; gap: 8px; margin-bottom: 1rem; }
.btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border2); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn:active { transform: scale(0.98); }

.table-block { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; margin-bottom: 0.9rem; }
.table-title { font-size: 11px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 0.7rem; }
.seat-row { display: flex; gap: 6px; margin-bottom: 6px; }
.seat-row.inner { padding-left: calc(46px + 6px); } /* 안쪽줄을 마주봄 짝 아래로 정렬 */
.seat { cursor: pointer; width: 46px; height: 58px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.seat .n { font-size: 11px; color: var(--text3); line-height: 1; }
.seat .id { font-size: 13px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.seat .t { font-size: 9px; color: var(--text3); margin-top: 1px; line-height: 1; }
.seat.overdue { background: #fdecea !important; border-color: #e8a89e !important; }
.seat.overdue .t { color: var(--danger); font-weight: 700; }
.m-hist { font-size: 12px; color: var(--text2); line-height: 1.7; background: var(--surface2); border-radius: 8px; padding: 8px 10px; margin: 0.4rem 0 0.2rem; }
.m-hist .h-row b { color: var(--text); }
.btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.seat.sel { outline: 3px solid var(--accent); outline-offset: -1px; }
.seat.dup { outline: 2px solid var(--danger); outline-offset: -1px; }
.manual-hint { font-size: 12px; color: var(--accent); font-weight: 500; background: #eef0f5; border: 1px solid var(--border2); border-radius: 8px; padding: 8px 10px; margin-bottom: 0.8rem; }
.m-order { width: 100%; margin-top: 0.8rem; padding: 12px; background: var(--success); color: #fff; border: none; border-radius: 8px; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer; }
.seat.m { background: var(--maleBg); border-color: #c3d4ee; }
.seat.m .id { color: var(--male); }
.seat.f { background: var(--femaleBg); border-color: #eecada; }
.seat.f .id { color: var(--female); }
.seat.empty .id { color: var(--text3); font-weight: 400; font-size: 11px; }
.hint { font-size: 12px; color: var(--text3); margin-top: 4px; }
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: center; justify-content: center; z-index: 100; padding: 1rem; }
.modal-bg.on { display: flex; }
.modal-card { background: var(--surface); border-radius: 14px; padding: 1.4rem; width: 100%; max-width: 320px; }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 0.8rem; }
.m-label { font-size: 11px; color: var(--text3); margin: 0.7rem 0 6px; }
.m-input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 18px; letter-spacing: 0.1em; font-family: inherit; outline: none; }
.m-gender { display: flex; gap: 8px; }
.m-gbtn { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-family: inherit; font-size: 15px; color: var(--text2); cursor: pointer; }
.m-gbtn.sel-m { background: var(--maleBg); border-color: var(--male); color: var(--male); font-weight: 500; }
.m-gbtn.sel-f { background: var(--femaleBg); border-color: var(--female); color: var(--female); font-weight: 500; }
.m-btns { display: flex; gap: 8px; margin-top: 1.2rem; }
.m-btns .btn { margin-top: 0; }
.m-leave { width: 100%; margin-top: 10px; padding: 10px; background: none; border: none; color: var(--danger); font-family: inherit; font-size: 13px; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>우연 — 자리 관리</h1>
    <div class="meta" id="meta">—</div>
  </div>
  <div class="bar">
    <button class="btn" onclick="loadSeats()">↻ 새로고침</button>
    <button class="btn" id="manualBtn" onclick="toggleManual()">✋ 수동 이동</button>
    <button class="btn primary" onclick="doMove()">🔀 자리 이동</button>
  </div>
  <div id="manualHint" class="manual-hint hidden">수동 이동 켜짐 — 옮길 손님 자리를 누른 뒤, 보낼 자리를 누르세요. (둘 다 손님이면 서로 교환)</div>

  <div class="table-block">
    <div class="table-title">왼쪽 테이블 (1~12)</div>
    <div class="seat-row" id="L_outer"></div>
    <div class="seat-row inner" id="L_inner"></div>
  </div>
  <div class="table-block">
    <div class="table-title">오른쪽 테이블 (13~26)</div>
    <div class="seat-row" id="R_outer"></div>
    <div class="seat-row inner" id="R_inner"></div>
  </div>
  <div class="hint">남자=파랑 / 여자=분홍. 칸 안 숫자는 자리번호, 큰 글씨는 손님 뒷4자리. (칸을 누르면 수동 등록/수정)</div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-title"><span id="mSeat">—</span>번 자리</div>
    <div class="m-label">전화번호 뒷 4자리</div>
    <input class="m-input" id="mId" type="tel" inputmode="numeric" maxlength="4" placeholder="0000">
    <div class="m-label">성별</div>
    <div class="m-gender">
      <button class="m-gbtn" id="mgM" onclick="mPick('남성')">남성</button>
      <button class="m-gbtn" id="mgF" onclick="mPick('여성')">여성</button>
    </div>
    <div class="m-hist hidden" id="mHist"></div>
    <button class="m-order hidden" id="mOrder" onclick="orderDone()">✓ 추가주문 완료 (90분 리셋)</button>
    <div class="m-btns">
      <button class="btn" onclick="closeModal()">닫기</button>
      <button class="btn primary" onclick="registerManual()">등록 / 수정</button>
    </div>
    <button class="m-leave hidden" id="mLeave" onclick="leaveManual()">이 자리 비우기 (퇴장)</button>
  </div>
</div>

      }
    }
    dupSet = new Set(Object.keys(seatCount).filter(function(k){return seatCount[k]>1;}).map(Number));
  } catch(e) { occ = {}; dupSet = new Set(); }
  try {
    const r2 = await fetch('https://sheets.googleapis.com/v4/spreadsheets/'+SHEET_ID+'/values/'+encodeURIComponent('설정!A13')+'?key='+API_KEY+'&_='+Date.now(), {cache:'no-store'});
    const d2 = await r2.json();
    cumLeave = (d2 && d2.values && d2.values[0] && d2.values[0][0]) ? (parseInt(d2.values[0][0])||0) : 0;
  } catch(e) {}
  renderBoard();
}

function elapsedMin(s){ if(!s) return null; var t=new Date(String(s).replace(' ','T')).getTime(); if(isNaN(t)) return null; return Math.floor((Date.now()-t)/60000); }
function hhmm(s){ s=String(s||''); var p=s.split(' '); return p[1] ? p[1].slice(0,5) : s; }

function renderBoard(){
  Object.keys(ROWS).forEach(function(rid){
    const el = document.getElementById(rid);
    el.innerHTML = ROWS[rid].map(function(n){
      const o = occ[n];
      let cls = o ? (o.gender==='남성'?'m':o.gender==='여성'?'f':'') : 'empty';
      const idTxt = o ? o.id : '빈자리';
      let tHtml = '';
      if (o) { const em = elapsedMin(o.lastOrder); if (em!=null) { if (em>=90) cls += ' overdue'; tHtml = '<span class="t">'+em+'분</span>'; } }
      if (manualMode && selA===n) cls += ' sel';
      if (dupSet.has(n)) cls += ' dup';
      return '<div class="seat '+cls+'" onclick="onSeatClick('+n+')"><span class="n">'+n+'</span><span class="id">'+idTxt+'</span>'+tHtml+'</div>';
    }).join('');
  });
  const list = Object.values(occ);
  const m = list.filter(o=>o.gender==='남성').length;
  const f = list.filter(o=>o.gender==='여성').length;
  const over = list.filter(function(o){var e=elapsedMin(o.lastOrder);return e!=null&&e>=90;}).length;
  document.getElementById('meta').textContent = '착석 '+list.length+'명 (남'+m+'/여'+f+')'+(over?' · 🔴'+over:'')+' · 누적 '+cumLeave+'명';
}

function doMove(){
  const actives = Object.entries(occ).map(function(e){ return { id:e[1].id, gender:e[1].gender, seat:parseInt(e[0]) }; });
  if (!actives.length) { alert('착석한 손님이 없어요.'); return; }
  const M = actives.filter(a=>a.gender==='남성').length;
  const F = actives.filter(a=>a.gender==='여성').length;
  const key = 'M'+M+'_F'+F;
  const sg = seatsByGender(key);
  if (!sg) { alert('이 인원 조합('+key+')은 배치표에 없어요. 인원/성별을 확인해주세요.'); return; }

  const men = shuffle(actives.filter(a=>a.gender==='남성'));
  const women = shuffle(actives.filter(a=>a.gender==='여성'));
  const ms = shuffle(sg.male), fs = shuffle(sg.female);
  const assign = [];
  men.forEach(function(p,i){ assign.push({ id:p.id, seat:ms[i] }); });
  women.forEach(function(p,i){ assign.push({ id:p.id, seat:fs[i] }); });

  if (!confirm(actives.length+'명의 자리를 새로 섞어 배정할까요?\n(손님은 본인 자리 QR을 찍으면 새 자리를 안내받아요)')) return;

  const payload = JSON.stringify({ type:'seatMove', assign: assign });
  try { fetch(GAS_URL, { method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain'}, body:payload }).catch(()=>{}); } catch(e) {}
  alert('자리 이동을 배정했어요. 손님들이 QR을 찍으면 새 자리가 안내됩니다.');
  setTimeout(loadSeats, 1500);
}

var mSeatNum = 0, mGender = '';
function openSeatModal(n){
  mSeatNum = n; mGender = '';
  document.getElementById('mSeat').textContent = n;
  var o = occ[n];
  document.getElementById('mId').value = o ? o.id : '';
  document.getElementById('mgM').className = 'm-gbtn';
  document.getElementById('mgF').className = 'm-gbtn';
  const mh = document.getElementById('mHist'), mo = document.getElementById('mOrder');
  if (o) {
    mPick(o.gender);
    document.getElementById('mLeave').classList.remove('hidden');
    mo.classList.remove('hidden');
    const hist = (o.history && o.history.length) ? o.history : [{ s: n, t: o.enter }];
    mh.innerHTML = '<b>자리 이력</b><br>' + hist.map(function(e,idx){ return '<div class="h-row"><b>'+e.s+'번</b> · '+hhmm(e.t)+' '+(idx===0?'입장':'이동')+'</div>'; }).join('');
    const em = elapsedMin(o.lastOrder);
    if (em!=null) mh.innerHTML += '<div class="h-row" style="margin-top:4px;color:'+(em>=90?'var(--danger)':'var(--text3)')+'">마지막 주문 후 '+em+'분 경과</div>';
    mh.classList.remove('hidden');
  } else {
    document.getElementById('mLeave').classList.add('hidden');
    mo.classList.add('hidden');
    mh.classList.add('hidden');
  }
  document.getElementById('modalBg').classList.add('on');
}
function closeModal(){ document.getElementById('modalBg').classList.remove('on'); }
function mPick(g){
  mGender = g;
  document.getElementById('mgM').className = 'm-gbtn' + (g==='남성'?' sel-m':'');
  document.getElementById('mgF').className = 'm-gbtn' + (g==='여성'?' sel-f':'');
}
function registerManual(){
  var id = document.getElementById('mId').value.replace(/\D/g,'').slice(0,4);
  if (id.length !== 4 || !mGender) { alert('뒷 4자리와 성별을 입력해주세요.'); return; }
  var payload = JSON.stringify({ type:'seatRegister', id:id, gender:mGender, seat:mSeatNum });
  try { fetch(GAS_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain'}, body:payload}).catch(function(){}); } catch(e) {}
  closeModal(); setTimeout(loadSeats, 1200);
}
function leaveManual(){
  if (!confirm(mSeatNum + '번 자리를 비울까요? (퇴장 처리, 누적 +1)')) return;
  var payload = JSON.stringify({ type:'seatLeave', seat:mSeatNum });
  try { fetch(GAS_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain'}, body:payload}).catch(function(){}); } catch(e) {}
  closeModal(); setTimeout(loadSeats, 1200);
}
function orderDone(){
  var payload = JSON.stringify({ type:'seatOrder', seat:mSeatNum });
  try { fetch(GAS_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain'}, body:payload}).catch(function(){}); } catch(e) {}
  closeModal(); setTimeout(loadSeats, 1200);
}

function toggleManual(){
  manualMode = !manualMode; selA = null;
  document.getElementById('manualBtn').classList.toggle('active', manualMode);
  document.getElementById('manualHint').classList.toggle('hidden', !manualMode);
  renderBoard();
}
function onSeatClick(n){ if (manualMode) manualPick(n); else openSeatModal(n); }
function manualPick(n){
  if (selA === null) { if (!occ[n]) { return; } selA = n; renderBoard(); return; }
  if (n === selA) { selA = null; renderBoard(); return; }
  var assign = [{ id: occ[selA].id, seat: n }];
  if (occ[n]) assign.push({ id: occ[n].id, seat: selA });
  var label = occ[n] ? (selA+'번 ↔ '+n+'번 교환') : (selA+'번 → '+n+'번 이동');
  if (!confirm(label + ' 할까요?')) return;
  var payload = JSON.stringify({ type:'seatMove', assign: assign });
  try { fetch(GAS_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain'}, body:payload}).catch(function(){}); } catch(e) {}
  selA = null; setTimeout(loadSeats, 1200);
}

loadSeats();
setInterval(loadSeats, 8000);
</script>
